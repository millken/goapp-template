name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # The frontend had no CI at all, which is why `pnpm type-check` could stay
  # broken unnoticed. It is also the guard against `make update-npm`
  # (pnpm update --latest) pulling in a TypeScript that vue-tsc cannot drive.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile fails if package.json and the lockfile disagree.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The test runner must never reach a user's browser. Vite only bundles
      # what its entries reach, so this should be impossible — which is exactly
      # why it is worth pinning rather than assuming.
      - name: Test deps stay out of the bundle
        run: |
          if grep -rlE 'vitest|happy-dom' dist/; then
            echo "test dependencies leaked into dist/" >&2
            exit 1
          fi
